# Who can decrypt what. sops reads this when it *creates or edits* a file —
# changing it does not re-encrypt anything on its own, you have to run
# `sops updatekeys <file>` afterwards (SOPS-SETUP.md step 5).
#
# Every age public key below is a slot. The placeholders are not valid keys;
# sops will refuse to encrypt until each one you actually use is replaced with
# a real `age1...` public key. Delete the slots for machines you don't have.

keys:
  # ---------------------------------------------------------------------
  # Admin key — yours, not a machine's. Lives in
  # ~/.config/sops/age/keys.txt on whichever machine you edit secrets from,
  # and is the only key that can read secrets/passwords.yaml. Back up the
  # private half somewhere off-disk; losing it means losing every secret
  # that no machine key can read.
  #   age-keygen -o ~/.config/sops/age/keys.txt
  # ---------------------------------------------------------------------
  - &admin age1admznc3va8vdat83cjz25gn7gkkdw0zu3yekyjga536a7u0wkyfs4w57f8

  # ---------------------------------------------------------------------
  # One slot per machine. The private half is /var/lib/sops-nix/key.txt on
  # that machine and never leaves it; paste the public half here.
  #   age-keygen -y /var/lib/sops-nix/key.txt
  # ---------------------------------------------------------------------
  - &desktop age1h4079pgrsxjume5nseehtmqslmrq4yft9mprm3fsspyauqgcxqtqd9a0s8
  # - &laptop age1REPLACE_ME_WITH_THE_LAPTOP_PUBLIC_KEY
  - &work_laptop age15x60jwwegnk542nhvlvw2y5zagdr2ed47chx5qx772a2txnrtgjshwrn4e
  # - &work_pc age1REPLACE_ME_WITH_THE_WORK_LAPTOP_PUBLIC_KEY
  # - &daq-laptop age1REPLACE_ME_WITH_THE_DAQ_LAPTOP_PUBLIC_KEY

creation_rules:
  # Machine-readable secrets: ssh private keys, the NordLynx key. Readable by
  # you and by every machine, because hosts/shared/global/secrets.nix reads
  # this file on all of them.
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *admin
          - *desktop
          - *work_laptop
          # add *laptop / *work_pc / *work_laptop / *daq-laptop here as you
          # set them up,
          # then run `sops updatekeys secrets/common.yaml` (step 5)

  # Your password store. Admin key only — no machine ever needs to decrypt
  # this, it is read on demand by `pw` with your own key.
  - path_regex: secrets/passwords\.yaml$
    key_groups:
      - age:
          - *admin

  # Per-machine secrets, for anything the other machines must not read.
  # Optional: nothing uses these until you create the file and point a
  # sops.secrets entry at it (see the comment in secrets.nix).
  - path_regex: secrets/hosts/desktop\.yaml$
    key_groups:
      - age: [*admin, *desktop, *work_laptop]
  # Uncomment a block once you've added that machine's anchor above:
  # - path_regex: secrets/hosts/laptop\.yaml$
  #   key_groups:
  #     - age: [*admin, *laptop]
  # - path_regex: secrets/hosts/work_pc\.yaml$
  #   key_groups:
  #     - age: [*admin, *work_pc]
  # - path_regex: secrets/hosts/work_laptop\.yaml$
  #   key_groups:
  #     - age: [*admin, *work_laptop]
  # - path_regex: secrets/hosts/daq-laptop\.yaml$
  #   key_groups:
  #     - age: [*admin, *daq-laptop]
