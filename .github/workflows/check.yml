name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluates every host's toplevel and runs alejandra --check.
      # Evaluation alone catches renamed/removed options, which otherwise
      # only surface at rebuild time on the machine itself.
      - name: nix flake check
        run: nix flake check --no-build --show-trace

      # --no-build above only *instantiates* the formatting derivation; it
      # never runs alejandra. Build that one check so formatting is enforced.
      - name: formatting
        run: nix build .#checks.x86_64-linux.formatting -L
